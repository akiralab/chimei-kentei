[project]
name = "chimei-kentei-geo"
version = "0.1.0"
description = "e-Stat 2020 国勢調査 小地域境界データから地図 GeoJSON と市区町村統計を生成する"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.1",
    "pyogrio>=0.9",
    "pandas>=2.2",
    # macOS x86_64 向けの pyproj 3.8 系はソースビルド（PROJ 必須）になるため上限を置く
    "pyproj<3.8",
]
